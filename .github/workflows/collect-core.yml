name: Collect Kraken fast core mirror

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: Bounded session length (10-240 minutes)
        type: string
        default: "240"
      handoff_remaining:
        description: Remaining guarded successors (0-7); schedule remains fallback
        type: string
        default: "7"
  push:
    branches: [main]
    paths:
      - ".github/workflows/collect-core.yml"
      - "scripts/collect.py"
      - "scripts/collect_core.py"
      - "scripts/public_transport.py"
      - "scripts/quote_guard.py"
      - "scripts/evidence_guard.py"
      - "scripts/collector_runtime.py"
      - "scripts/run_public_collector.py"
      - "scripts/test_owned_coverage.py"
      - "scripts/test_operational_recovery.py"
      - "config/assets.json"
  schedule:
    - cron: "17,47 * * * *"

env:
  PYTHONPYCACHEPREFIX: /tmp/caw-python-cache

permissions:
  contents: write
  actions: write

concurrency:
  group: kraken-fast-core-collector
  # A reviewed code deployment replaces old code. Scheduled successors queue.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  collect-core:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regression tests (including test_owned_coverage.py)
        run: python -B -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Single upstream owner and guarded continuation
        env:
          GH_TOKEN: ${{ github.token }}
          # First deployment makes a short real handoff check; successors use 4h.
          CAW_SESSION_MINUTES: ${{ inputs.session_minutes || (github.event_name == 'push' && '10') || '240' }}
          CAW_HANDOFF_REMAINING: ${{ inputs.handoff_remaining || '7' }}
        run: python -B scripts/run_public_collector.py core
