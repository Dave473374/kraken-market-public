name: Collect Kraken public mirror

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/collect.yml"
      - "scripts/collect.py"
      - "scripts/collect_core.py"
      - "scripts/public_transport.py"
      - "scripts/quote_guard.py"
      - "scripts/evidence_guard.py"
      - "scripts/collector_runtime.py"
      - "scripts/run_public_collector.py"
      - "scripts/test_owned_coverage.py"
      - "scripts/test_operational_recovery.py"
      - "config/assets.json"
  schedule:
    - cron: "1 * * * *"

env:
  PYTHONPYCACHEPREFIX: /tmp/caw-python-cache

permissions:
  contents: write

concurrency:
  group: kraken-market-public-collector
  cancel-in-progress: true

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regression tests (including test_owned_coverage.py)
        run: python -B -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Archive immutable core snapshot; never request Worker again
        run: python -B scripts/run_public_collector.py archive
