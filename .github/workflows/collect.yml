name: Collect Kraken public mirror

on:
  workflow_dispatch:
  schedule:
    - cron: "1 * * * *"

permissions:
  contents: write

concurrency:
  group: kraken-market-public-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect public Kraken snapshots
        run: python scripts/collect.py

      - name: Commit updated mirror
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No mirror changes to commit."
            exit 0
          fi
          git commit -m "Update Kraken public mirror"
          git push
