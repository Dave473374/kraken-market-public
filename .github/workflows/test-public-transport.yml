name: Test Kraken public evidence transport

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "config/assets.json"
      - ".github/workflows/collect.yml"
      - ".github/workflows/collect-core.yml"
      - ".github/workflows/test-public-transport.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "config/assets.json"
      - ".github/workflows/collect.yml"
      - ".github/workflows/collect-core.yml"
      - ".github/workflows/test-public-transport.yml"

env:
  PYTHONPYCACHEPREFIX: /tmp/caw-python-cache

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: All offline evidence, transport, archive and publication regressions
        run: python -B -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Bounded read-only diagnostic for this repair PR only
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/caw-cooldown-20261006'
        run: python -B scripts/probe_public_transport.py
      - name: Direct Kraken and independent-provider test (this repair PR only)
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/caw-direct-sources-20261006'
        run: python -B scripts/probe_direct_sources.py
