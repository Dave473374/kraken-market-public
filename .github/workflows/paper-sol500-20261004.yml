name: SOL 500 EUR Paper Trial
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/paper-sol500-20261004.yml'
      - 'research/paper-sol500-20261004/**'
  workflow_dispatch:
  schedule:
    # Backup starter only. Actual 300-second cadence is inside runner.py.
    - cron: '17,47 * 4-11 10 *'
permissions:
  contents: write
  actions: write
concurrency:
  # Keep the original single-writer lock. Never interrupt an active writer.
  group: paper-sol500-20261004
  cancel-in-progress: false
jobs:
  paper:
    if: github.repository == 'Dave473374/kraken-market-public' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-latest
    # Includes bounded publication retries and artifact upload, not a longer trial.
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: engine
          persist-credentials: false
      - name: Check fixed operational window
        id: gate
        shell: bash
        run: |
          if [ "$(date -u +%s)" -lt "$(date -u -d '2026-10-11 08:30:00 UTC' +%s)" ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Test unchanged strategy and operational safeguards
        if: steps.gate.outputs.run == 'true'
        run: python3 -m unittest discover -s engine/research/paper-sol500-20261004 -p 'test_*.py' -v
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with:
          ref: paper-sol500-20261004
          path: ledger
          fetch-depth: 1
      - name: Recover unpublished evidence and supervise public-only paper engine
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: '1'
          BURST_MINUTES: ${{ github.event_name == 'push' && '6' || '180' }}
        run: python3 engine/research/paper-sol500-20261004/reliable_runner.py --ledger ledger --minutes "$BURST_MINUTES"
      - name: Preserve full unpublished recovery evidence on failure
        if: failure() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sol500-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          # Includes ORIGINAL observation files; excludes .git and all credentials.
          path: ledger/research/paper-sol500-20261004/
      - name: Disable only this scheduler after completion or fixed cutoff
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          finished=false
          if [ -f ledger/research/paper-sol500-20261004/state.json ]; then
            finished=$(python3 -c "import json; print(str(json.load(open('ledger/research/paper-sol500-20261004/state.json')).get('final') is True).lower())")
          fi
          if [ "$finished" = true ] || [ "$(date -u +%s)" -ge "$(date -u -d '2026-10-11 08:30:00 UTC' +%s)" ]; then
            gh api --method PUT repos/Dave473374/kraken-market-public/actions/workflows/paper-sol500-20261004.yml/disable
          fi
